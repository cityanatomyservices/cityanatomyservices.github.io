project_id = "austin-chat"

# Authentication is checked inside each function. The reminder endpoint also
# supports public readiness and token-based unsubscribe; the worker requires
# a separate random secret known only to Cron and the Edge runtime.
[functions.reminders]
verify_jwt = false

[functions.reminder-send]
verify_jwt = false

# Billing validates the registered Supabase user; Stripe verifies its raw body
# with a webhook signature. Neither endpoint trusts gateway JWT parsing alone.
[functions.billing]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Every asset request checks a confirmed user's live, paid membership.
[functions.pro-app]
verify_jwt = false

# Separate paid custom geofences, with confirmed-account and signed webhook checks.
[functions.geofences]
verify_jwt = false
[functions.geofence-webhook]
verify_jwt = false
