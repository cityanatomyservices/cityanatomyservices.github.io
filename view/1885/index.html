mkdir -p view
cat > view/template.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin.Chat</title>
  <link href="/style.css?v=20261022f" rel="stylesheet" />
</head>
<body>
  <!-- A framed page for one app. Which app is decided by this folder's name
       (view.js); every folder under /view/ holds this same file. To add one,
       give the app a slug in home.json and run: node tools/make-views.js -->
  <main>
    <section class="map-hero">
      <iframe
        id="app-window"
        class="app-window"
        src="about:blank"
        title="App"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen; geolocation">
      </iframe>
    </section>
  </main>

  <script src="/shell.js?v=20261022f"></script>
  <script src="/view.js?v=20261022f"></script>
</body>
</html>
