name: Render Report Promo Videos

on:
  push:
    branches: [main]
    paths:
      - "content/report-videos/template/**"
      - "content/report-videos/reports/**"
      - "content/report-videos/build.js"
      - "content/report-videos/package.json"
      - "content/report-videos/package-lock.json"
  workflow_dispatch:
    inputs:
      report:
        description: "Report to render"
        required: false
        default: all
        type: choice
        options:
          - all
          - austin-bike-shops
          - austin-golf-courses
          - austin-horseback-riding
          - austin-toy-stores
          - austin-vintage-guitar
          - pool-openings

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: report-video-render
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: content/report-videos
        run: npm ci --no-audit --no-fund

      - name: Render videos
        working-directory: content/report-videos
        run: |
          if [[ -n "$REPORT" && "$REPORT" != 'all' ]]; then
            [[ "$REPORT" =~ ^[a-z0-9-]+$ && -f "reports/$REPORT.json" ]]
            node build.js "$REPORT" --render
          else
            echo "Rendering all reports"
            npm run render:all
          fi
        env:
          REPORT: ${{ inputs.report }}

      - name: Commit rendered videos to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- apps/reports/*/promo.mp4
          if git diff --cached --quiet; then
            echo "No video changes to commit."
          else
            git commit -m "chore: render report promo videos [skip ci]"
            bash tools/publish-data.sh
          fi
