name: Build daily Austin feed

on:
  schedule:
    - cron: "0 10 * * *"         # 10:00 UTC = 05:00 Austin (CDT) — fresh batch before users wake
  workflow_dispatch:              # also runnable on-demand from Actions tab

permissions:
  contents: write

concurrency:
  group: build_daily_feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build feed
        run: python tools/build_feed.py

      - name: Commit if changed
        run: |
          if git diff --quiet --exit-code feed/; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name  "austin-feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed/
          git commit -m "Daily feed: $(date -u +%Y-%m-%d)"
          git push
