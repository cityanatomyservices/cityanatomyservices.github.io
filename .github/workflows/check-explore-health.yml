name: Check Explore feed health
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      probe_sources:
        description: Diagnose Fallout and Saxon responses from the GitHub runner
        type: boolean
        default: false
  workflow_run:
    workflows: ['Publish Austin.chat']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: explore-feed-health
  cancel-in-progress: false
jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Check the feeds visitors receive
        run: node tools/explore/check-health.cjs https://austin.chat
      - name: Match the importer Python version
        if: always() && inputs.probe_sources
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Diagnose public calendar responses
        if: always() && inputs.probe_sources
        run: python tools/explore/diagnose-sources.py
