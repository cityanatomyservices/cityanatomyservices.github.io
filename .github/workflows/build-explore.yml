name: Refresh Explore map layers
on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: explore-map
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The daily live check alerts on individual source failures.
      EXPLORE_SOURCE_ALERTS: warn
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A queued run must include the preceding refresh's published data.
          ref: main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install calendar readers
        run: python -m pip install -r tools/explore/requirements.txt
      - run: python -m unittest discover -s tools/explore -p 'test_*.py'
      - run: node tools/explore/test-model.cjs
      - run: node --test tools/explore/test-health.cjs
      - name: Refresh events
        id: events
        continue-on-error: true
        run: python tools/explore/build.py
      - name: Refresh movie showtimes
        id: movies
        continue-on-error: true
        run: python tools/explore/build_movies.py
      - name: Refresh local calendars
        id: culture
        continue-on-error: true
        run: python tools/explore/build_layers.py
      - name: Publish map data
        id: publish_data
        run: |
          git config user.name 'austin-explore bot'
          git config user.email 'cityanatomyservices@users.noreply.github.com'
          git add chat/data/explore/*.geojson tools/explore/venue-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Explore map data'
          bash tools/publish-data.sh
      # Import steps retain validated data even when one source fails. Dispatch
      # only after that data is committed; the run can still report failure.
      - name: Deploy available map data
        if: steps.publish_data.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-site.yml --ref main
      - name: Feed health summary
        if: always()
        run: node tools/explore/check-health.cjs
      - name: Report failed imports
        if: always() && (steps.events.outcome == 'failure' || steps.movies.outcome == 'failure' || steps.culture.outcome == 'failure')
        run: |
          echo "::error::Explore imports: events=${{ steps.events.outcome }}, movies=${{ steps.movies.outcome }}, local calendars=${{ steps.culture.outcome }}. Open the matching Refresh step above for the source error."
          exit 1
