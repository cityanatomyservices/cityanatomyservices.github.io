name: Refresh Austin neighborhood businesses

on:
  schedule:
    - cron: '43 10 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: austin-neighborhood-businesses
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/places/requirements.txt
      - run: pip install -r tools/places/requirements.txt
      - name: Check directory matching and neighborhood boundaries
        run: |
          python -m unittest discover -s tools/places -p 'test_*.py'
          node tools/places/test-locate.cjs
      - run: python tools/fetch-places.py
      - name: Save validated directory
        run: |
          git config user.name 'austin-directory bot'
          git config user.email 'cityanatomyservices@users.noreply.github.com'
          git add chat/data/places/ chat/data/places-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Austin neighborhood businesses'
          git pull --rebase origin main
          git push origin HEAD:main
