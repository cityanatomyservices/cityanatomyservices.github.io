name: Nightly event scrape

on:
  schedule:
    - cron: "0 9 * * *"          # 09:00 UTC = 04:00 Austin (CDT)
  workflow_dispatch:              # also runnable on-demand from Actions tab

permissions:
  contents: write

concurrency:
  group: scrape_events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scrapers
        run: python -m tools.scrape_events.run

      - name: Commit if changed
        run: |
          if git diff --quiet --exit-code data/; then
            echo "No event data changes."
            exit 0
          fi
          git config user.name  "austin-chat-events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add data/
          git commit -m "Nightly event scrape: $(date -u +%Y-%m-%d)"
          git push
