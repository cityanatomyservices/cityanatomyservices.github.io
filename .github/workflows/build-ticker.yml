name: Refresh Austin ticker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: austin-ticker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check feed parsing and ticker selection
        run: |
          python -m unittest discover -s tools/news -p 'test_*.py'
          node tools/news/test-ticker.cjs
      - run: python tools/news/build-ticker.py
      - name: Save updated feed
        run: |
          git config user.name 'austin-ticker bot'
          git config user.email 'cityanatomyservices@users.noreply.github.com'
          git add ticker/feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Austin ticker feed'
          git pull --rebase origin main
          git push origin HEAD:main
