name: Check private dashboard
on:
  push:
    branches: [main]
    paths: ['dashboard/**','tools/dashboard/**','tests/dashboard/**','supabase/migrations/*dashboard.sql','.github/workflows/test-dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dashboard-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: dashboard-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Excel file integrity and unlisted page
        run: node --test tests/dashboard/*.test.mjs
      - name: Owner authorization, report isolation, filters and pagination
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/classifieds/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -c 'create role service_role bypassrls;'
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0012_billing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0014_substack_billing.sql
          psql -v ON_ERROR_STOP=1 -f tests/dashboard/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0015_dashboard.sql
          psql -v ON_ERROR_STOP=1 -f tests/dashboard/database.sql
      - name: Syntax checks
        run: |
          node --check dashboard/app.js
          python3 -m py_compile tools/dashboard/configure.py
