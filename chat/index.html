<!DOCTYPE html>
<html lang="en" data-austin-map>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin neighborhoods</title>
  <link rel="icon" href="data:," />
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- THE CHAT MAP: the centre of the austin.chat home page (index.html
       frames this page in its window). The 65 neighborhood geofences from
       chat/data/geofences.geojson, the neighborhood panel opened by Chat
       and, on the right, the round control stack of the
       walking-tour apps: GPS, 2D/3D, satellite, extents. Zoom is top left. The
       card says who you are, which neighborhood your phone is in, and who
       else is visible there; the conversation opens through its Chat button.
       It borrows the topic maps' stylesheet so it looks the same, but not
       their engine (topicmap/app.js draws dots and runs a story timeline).
       Files: config.js (data, Supabase), copy.js (words), auth.js (your
       name: an anonymous Supabase account), locate.js (GPS to geofence), chat.js (the Supabase channel),
       panel.js + panel.css (the chat window), room.js (the wiring, shared
       with the apps under /apps/ — see chat/README.md), map.js (the map).
       Test switches: ?room=<geofence id> joins that neighborhood without GPS
       (ids are in data/geofences.geojson), so two tabs can talk at a desk;
       &place=<place id> then picks that business (ids in data/places/).
       ?v= so a push is actually seen (GitHub Pages caches hard): bump it
       on the file that changed. -->
  <link rel="stylesheet" href="../topicmap/style.css?v=20260914k" />
  <link rel="stylesheet" href="./panel.css?v=20261023e" />
  <link rel="stylesheet" href="./style.css?v=20261029u" />
  <link rel="stylesheet" href="./explore/explore.css?v=20261028e" />
  <link rel="stylesheet" href="../appearance.css?v=20261028h" />
  <script src="./theme.js?v=20261028g"></script>
  <link rel="stylesheet" href="/planner/select.css?v=20261029u">
</head>
<body>
  <div class="page">
    <div id="map"></div>

    <!-- The Chat control reveals the existing neighborhood panel. -->
    <div class="topleft">
      <aside class="legend" id="legend" hidden aria-label="Neighborhood chat">
        <button class="card-toggle legend-title" id="legendTitle" type="button" aria-expanded="false" aria-controls="legendBody"></button>
        <p class="people-line" id="peopleLine"></p>
        <div id="legendBody" hidden>
          <p class="you"><span id="youLabel"></span> <span class="handle" id="youHandle"></span><button class="small" id="newName" type="button"></button></p>
          <p class="room-line" id="roomLine"></p>
          <div class="chat-btns">
            <button id="visibleBtn" type="button" aria-pressed="false"></button>
            <button id="chatBtn" type="button" disabled></button>
          </div>
          <!-- the neighborhood's businesses by category (room.js fills it) -->
          <div class="place-list" id="placeList"></div>
        </div>
      </aside>
    </div>

    <!-- Map panels and display controls; the MapLibre zoom control is top left. -->
    <div class="stack" id="stack">
      <button class="round apps-control" id="ctrlApps" type="button" aria-expanded="false" aria-controls="apps-panel" aria-label="Apps" title="Apps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3Z M14 3h7v7h-7Z M3 14h7v7H3Z M14 14h7v7h-7Z"/></svg><span>Apps</span>
      </button>
      <button class="round day-plan-control" id="ctrlDayPlan" type="button" aria-expanded="false" aria-controls="day-plan-panel" aria-label="Day Plan" title="Day Plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z M7 2v5 M17 2v5 M3 10h18 M8 14h3 M8 17h7"/></svg><span>Day Plan</span>
      </button>
      <button class="round chat-control" id="ctrlChat" type="button" aria-expanded="false" aria-controls="legend" aria-label="Neighborhood chat" title="Neighborhood chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z M8 8h8 M8 12h5"/></svg><span>Chat</span>
      </button>
      <button class="round explore-control" id="ctrlExplore" type="button" aria-expanded="false" aria-controls="explore-panel" aria-label="Explore Austin map layers" title="Explore Austin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 11 6-11 6L1 8zm-8 11 8 4.4 8-4.4 3 1.6-11 6-11-6z"/></svg><span>Explore</span>
      </button>
      <button class="round round-text" id="ctrlLocate" type="button">GPS</button>
      <button class="round" id="ctrlTilt" type="button" aria-pressed="false">3D</button>
      <button class="round round-text" id="ctrlSatellite" type="button" aria-pressed="false">Sat</button>
      <button class="round" id="ctrlExtent" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg>
      </button>
    </div>

    <!-- the chat window (panel.js) -->
    <section class="chatwin" id="chatwin" hidden aria-label="Chat">
      <div class="chat-head">
        <h2 id="chatRoom"></h2>
        <button id="chatClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="chat-people" id="chatPeople"></div>
      <ul class="chat-lines" id="chatLines"></ul>
      <div class="chat-form">
        <input id="chatText" type="text" autocomplete="off" />
        <button id="chatSend" type="button"></button>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./copy.js?v=20261028i"></script>
  <script src="./config.js?v=20261029a"></script>
  <script src="/shared/visit.js?v=20261029u"></script>
  <script src="/shared/session.js?v=20261029u"></script>
  <script src="./auth.js?v=20261029u"></script>
  <script src="./locate.js?v=20261028i"></script>
  <script src="./chat.js?v=20261029u"></script>
  <script src="./panel.js?v=20261023e"></script>
  <script src="./room.js?v=20261029u"></script>
  <script src="./explore/config.js?v=20261028e"></script>
  <script src="./explore/model.js?v=20261028e"></script>
  <script src="./explore/explore.js?v=20261029u"></script>
  <script src="/planner/model.js?v=20261029r"></script>
  <script src="/planner/sources.js?v=20261029r"></script>
  <script src="/planner/repository.js?v=20261029r"></script>
  <script src="/planner/store.js?v=20261029u"></script>
  <script src="/planner/select.js?v=20261029u"></script>
  <script src="./apps-menu.js?v=20261029u"></script>
  <script src="./map.js?v=20261029u"></script>
</body>
</html>
