<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin.Chat</title>
  <link rel="canonical" href="https://austin.chat/" />
  <link href="/style.css?v=20261023e" rel="stylesheet" />
  <link rel="stylesheet" href="/appearance.css?v=20261028h" />
  <script src="/shared/visit.js?v=20261029u"></script>
</head>
<body>
  <!-- Home page: only the map window lives here. The header, menu and
       footer are drawn by shell.js, the same on every page. The window holds
       the chat map (/chat/, the neighborhood geofences); home.js would run
       the demo reel, but no app in home.json is marked `demo` any more. -->
  <main>
    <section class="map-hero">
      <iframe
        id="app-window"
        class="app-window"
        src="/chat/?v=20261029u"
        title="Chat map"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen; geolocation"
        loading="lazy">
      </iframe>
    </section>
  </main>

  <script src="/shell.js?v=20261029u"></script>
  <script src="/home.js?v=20261023e"></script>
</body>
</html>
