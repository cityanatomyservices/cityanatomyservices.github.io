<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatMaps · City Anatomy</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0e1117; }
    #map { position: fixed; inset: 0; }

    /* ── Legend — top-right ──────────────────────────────────────── */
    .cm-legend {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(22, 27, 35, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a3040;
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      font-size: 0.78rem;
      color: #f5f7fa;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .cm-legend h2 {
      margin: 0 0 2px;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      color: #c0c7d1;
    }
    .cm-legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cm-legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      flex-shrink: 0;
    }
    .cm-legend-row a {
      color: #f5f7fa;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }
    .cm-legend-row a:hover { color: #4cc3ff; }

    /* ── Brand card — bottom-center pill ──────────────────────────── */
    .cm-brand-card {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(22, 27, 35, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a3040;
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      align-items: baseline;
      gap: 10px;
      max-width: calc(100vw - 32px);
      white-space: nowrap;
    }
    .cm-brand-link {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c0c7d1;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .cm-brand-link:hover { color: #4cc3ff; }
    .cm-brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f5f7fa;
      line-height: 1.2;
    }

    @media (max-width: 500px) {
      .cm-legend { top: 10px; right: 10px; padding: 8px 10px; font-size: 0.72rem; }
      .cm-brand-card { bottom: 14px; padding: 5px 12px; }
      .cm-brand-title { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <aside class="cm-legend" aria-label="ChatMaps legend">
    <h2>ChatMaps · Austin</h2>
    <div class="cm-legend-row">
      <span class="cm-legend-dot" style="background: #e11d74"></span>
      <a href="/pubchat/" target="_top">Pubchat</a>
    </div>
    <div class="cm-legend-row">
      <span class="cm-legend-dot" style="background: #1a73ff"></span>
      <a href="/librarychat/" target="_top">LibraryChat</a>
    </div>
    <div class="cm-legend-row">
      <span class="cm-legend-dot" style="background: #f59e0b"></span>
      <a href="/homelesschat/" target="_top">Feedingschat</a>
    </div>
    <div class="cm-legend-row">
      <span class="cm-legend-dot" style="background: #10b981"></span>
      <a href="/foodtrucks/" target="_top">FoodtruckChat</a>
    </div>
    <div class="cm-legend-row">
      <span class="cm-legend-dot" style="background: #ef4444"></span>
      <a href="/clinics/" target="_top">ClinicChat</a>
    </div>
  </aside>

  <div class="cm-brand-card">
    <a href="/" class="cm-brand-link" target="_top">City Anatomy <span aria-hidden="true">↗</span></a>
    <span class="cm-brand-title">ChatMaps · Austin</span>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script>
    const APPS = [
      { id: 'pubchat',       url: '/pubchat/hotspots.json',      color: '#e11d74' },
      { id: 'librarychat',   url: '/librarychat/hotspots.json',  color: '#1a73ff' },
      { id: 'feedingschat',  url: '/homelesschat/hotspots.json', color: '#f59e0b' },
      { id: 'foodtrucks',    url: '/foodtrucks/hotspots.json',   color: '#10b981' },
      { id: 'clinics',       url: '/clinics/hotspots.json',      color: '#ef4444' },
    ];

    function circlePolygon([lng, lat], radiusMeters, points = 64) {
      const coords = [];
      const latRad = lat * Math.PI / 180;
      const mPerDegLat = 111320;
      const mPerDegLng = 111320 * Math.cos(latRad);
      for (let i = 0; i <= points; i++) {
        const a = (i / points) * 2 * Math.PI;
        const dLat = (radiusMeters * Math.cos(a)) / mPerDegLat;
        const dLng = (radiusMeters * Math.sin(a)) / mPerDegLng;
        coords.push([lng + dLng, lat + dLat]);
      }
      return { type: 'Polygon', coordinates: [coords] };
    }

    function toFeatures(hotspots, app) {
      return (hotspots || [])
        .filter(h => h.geofence?.center && h.geofence?.radiusMeters)
        .map(h => ({
          type: 'Feature',
          properties: {
            id: `${app.id}-${h.id}`,
            title: h.title,
            subtitle: h.subtitle || '',
            app: app.id,
            color: app.color,
          },
          geometry: circlePolygon(h.geofence.center, h.geofence.radiusMeters),
        }));
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-97.7420, 30.2950],
      zoom: 10.5,
      antialias: true,
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: false,
      showAccuracyCircle: true,
    });
    map.addControl(geolocate, 'top-left');

    map.on('load', async () => {
      const results = await Promise.all(
        APPS.map(app =>
          fetch(app.url)
            .then(r => r.ok ? r.json() : null)
            .then(json => ({ app, hotspots: json?.hotspots || [] }))
            .catch(() => ({ app, hotspots: [] }))
        )
      );

      const features = results.flatMap(({ app, hotspots }) => toFeatures(hotspots, app));

      map.addSource('chatmaps', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features },
      });

      map.addLayer({
        id: 'chatmaps-fill',
        type: 'fill',
        source: 'chatmaps',
        paint: {
          'fill-color': ['get', 'color'],
          'fill-opacity': 0.28,
        },
      });

      map.addLayer({
        id: 'chatmaps-outline',
        type: 'line',
        source: 'chatmaps',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 2,
          'line-opacity': 0.9,
        },
      });

      map.addLayer({
        id: 'chatmaps-label',
        type: 'symbol',
        source: 'chatmaps',
        layout: {
          'text-field': ['get', 'title'],
          'text-size': 11,
          'text-font': ['Noto Sans Regular'],
          'text-anchor': 'top',
          'text-offset': [0, 0.6],
          'text-allow-overlap': false,
        },
        paint: {
          'text-color': '#1c1c28',
          'text-halo-color': '#ffffff',
          'text-halo-width': 1.4,
        },
      });

      map.on('click', 'chatmaps-fill', (e) => {
        const f = e.features?.[0];
        if (!f) return;
        const linkMap = {
          pubchat:      '/pubchat/',
          librarychat:  '/librarychat/',
          feedingschat: '/homelesschat/',
          foodtrucks:   '/foodtrucks/',
          clinics:      '/clinics/',
        };
        const labelMap = {
          pubchat:      'Pubchat',
          librarychat:  'LibraryChat',
          feedingschat: 'Feedingschat',
          foodtrucks:   'FoodtruckChat',
          clinics:      'ClinicChat',
        };
        const href  = linkMap[f.properties.app];
        const label = labelMap[f.properties.app] || f.properties.app;
        if (!href) return;
        const html = `
          <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-width: 180px; padding: 14px 16px 16px;">
            <div style="font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: ${f.properties.color}; font-weight: 700;">${label}</div>
            <div style="font-size: 0.95rem; font-weight: 700; margin-top: 2px;">${f.properties.title}</div>
            ${f.properties.subtitle ? `<div style="font-size: 0.78rem; color: #5a6472; margin-top: 2px;">${f.properties.subtitle}</div>` : ''}
            <a href="${href}" target="_top" style="display: block; margin-top: 10px; text-align: center; background: ${f.properties.color}; color: #fff; border-radius: 8px; padding: 7px 12px; font-size: 0.82rem; font-weight: 700; text-decoration: none;">Open ${label} ↗</a>
          </div>
        `;
        new maplibregl.Popup({ offset: 4, closeButton: true, maxWidth: '260px' })
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
      });

      map.on('mouseenter', 'chatmaps-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'chatmaps-fill', () => { map.getCanvas().style.cursor = ''; });

      // Fly to user's location on load only if permission was already granted (no prompt)
      if (navigator.permissions) {
        navigator.permissions.query({ name: 'geolocation' }).then(result => {
          if (result.state === 'granted') {
            navigator.geolocation.getCurrentPosition(pos => {
              map.flyTo({
                center: [pos.coords.longitude, pos.coords.latitude],
                zoom: 12,
                duration: 1200,
              });
            });
          }
        });
      }
    });
  </script>
</body>
</html>
