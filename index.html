  <!-- Home header (owner, 2026-10-22): hamburger menu on the left, the site
       name in the middle, the day/night button on the right, all kept as
       short as a phone thumb allows so the map window gets the screen.
       Apps shows categories (from home.json), each opening to its apps; Maps
       lists the maps directly; home.js fills both. Content and Contact are
       plain links. -->
  <header id="top" class="topbar topbar-home">
    <div class="topbar-left">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">

    </div>
    <a class="brand brand-center" href="/index.html">Austin.Chat</a>
    <div class="topbar-right">
      <button class="theme-toggle" type="button" aria-label="Toggle color scheme">
        <span class="toggle-icon">☀️</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <nav id="site-menu" class="site-menu" hidden aria-label="Site menu">
      <details class="menu-section" open>
        <summary>Apps</summary>
        <div id="menu-apps" class="menu-groups"></div>
      </details>
      <details class="menu-section" open>
        <summary>Maps</summary>
        <ul id="menu-maps" class="menu-links"></ul>
      </details>
      <a class="menu-link" href="/content/">Content</a>
      <a class="menu-link" href="/contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="map-hero">

        class="app-window"
        src="/moontower/"
        title="Moontower"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        loading="lazy">

    </section>
