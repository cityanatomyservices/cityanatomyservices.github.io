<!doctype html><html lang="en" data-austin-map><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toy Stores & Children's Specialty Retailers in Greater Austin</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"><link rel="stylesheet" href="/shopmap/style.css?v=20261024a">
<style>html,body,.shopmap{height:100%;margin:0}body{overflow:hidden}</style>
<script src="/shared/map-ui.js?v=20261031a"></script></head><body>      <div class="shopmap">
        <div id="map"></div>

        <!-- left: the side panel — title, the dropdowns, the table; the arrow on
             its edge slides it away and back (app.js setPanel) -->
        <aside class="data-panel" id="dataPanel">
          <div class="panel-head">
            <h2 id="panelTitle"></h2>
            <p class="panel-sub" id="panelSub"></p>
            <div class="result-count" id="resultCount"></div>
          </div>
          <div class="filters" id="filters"></div>
          <!-- Export downloads the rows now in the table as a CSV; Reset puts every dropdown back to All -->
          <div class="panel-actions">
            <button class="panel-btn" id="exportBtn" type="button"></button>
            <button class="panel-btn" id="resetBtn" type="button"></button>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <!-- the arrow on the panel's edge: part of the panel, so it moves with it and the two always meet -->
          <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true" aria-controls="dataPanel">
            <span class="panel-toggle-arrow" aria-hidden="true"></span>
          </button>
        </aside>

        <!-- right: the round control stack, the same as the home map -->
        <div class="stack">
          <button class="round" id="ctrlLocate" type="button">&#9678;</button>
          <button class="round" id="ctrlTilt" type="button" aria-pressed="false">3D</button>
          <button class="round round-text" id="ctrlSatellite" type="button" aria-pressed="false">Sat</button>
          <button class="round" id="ctrlExtent" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg>
          </button>
          <button class="round" id="ctrlZoomIn" type="button">+</button>
          <button class="round" id="ctrlZoomOut" type="button">&minus;</button>
        </div>

        <!-- bottom right: the three views -->
        <div class="views">
          <button class="view-btn" id="viewStreet" type="button"></button>
          <button class="view-btn" id="viewNeighborhood" type="button"></button>
          <button class="view-btn" id="viewCity" type="button"></button>
        </div>
      </div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="/shopmap/words.js?v=20261023i"></script><script src="./config.js?v=20261023i"></script><script src="/shopmap/app.js?v=20261030e"></script></body></html>
