<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<style>
/* ── Variables ───────────────────────────────────────────────────── */
:root {
  --accent:       {{ACCENT}};
  --accent-bg:    color-mix(in srgb, var(--accent) 10%, white);
  --accent-mid:   color-mix(in srgb, var(--accent) 22%, white);
  --ink:          #1a1a1a;
  --muted:        #555;
  --rule:         #e5e5e5;
  --bg:           #fafaf7;
}

/* ── Reset ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Georgia, "Iowan Old Style", "Source Serif Pro", serif;
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

/* ── Hero ────────────────────────────────────────────────────────── */
.report-hero {
  position: relative;
  width: 100%;
  height: 340px;
  overflow: hidden;
  background: #111;
}
.report-hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.72;
}
.report-hero-overlay {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 28px 40px 32px;
  background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.62) 100%);
}
.hero-eyebrow {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.72);
  margin: 0 0 8px;
}
.hero-eyebrow a { color: rgba(255,255,255,0.88); text-decoration: none; }
.hero-eyebrow a:hover { color: #fff; }
h1.hero-title {
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 700;
  line-height: 1.12;
  color: #fff;
  margin: 0 0 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.hero-subtitle {
  font-size: 17px;
  font-style: italic;
  color: rgba(255,255,255,0.82);
  margin: 0;
}

/* ── Report container ────────────────────────────────────────────── */
.report {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 28px 96px;
}

/* ── Site bar (social icons) ─────────────────────────────────────── */
.site-bar {
  display: flex;
  justify-content: center;
  padding: 18px 0 6px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 20px;
}
.site-bar .social-icons { display: flex; gap: 14px; }
.site-bar .social-icons a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px;
  color: var(--muted);
  transition: color 0.15s ease;
  text-decoration: none;
}
.site-bar .social-icons a:hover { color: var(--accent); }
.site-bar .social-icons svg { width: 18px; height: 18px; }

/* ── Nav cards ───────────────────────────────────────────────────── */
.report-nav { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 24px; }
.report-nav a {
  flex: 1 1 180px; min-width: 150px;
  padding: 12px 16px 14px;
  background: var(--accent-bg);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  text-decoration: none;
  color: var(--ink);
  display: flex; flex-direction: column; gap: 3px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.report-nav a:hover, .report-nav button:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.08); text-decoration: none; }
.report-nav button { background: var(--accent-bg); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 10px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 3px; flex: 1 1 180px; min-width: 150px; padding: 12px 16px 14px; text-align: left; transition: transform 0.15s ease, box-shadow 0.15s ease; font: inherit; }
.rn-eyebrow {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.rn-label {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px; font-weight: 600; color: var(--ink);
}

/* ── Scoreboard strip ────────────────────────────────────────────── */
.report-scoreboard {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0 0 36px;
  padding: 18px 20px;
  background: var(--accent);
  border-radius: 12px;
}
.scoreboard-stat {
  flex: 1 1 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  text-align: center;
}
.scoreboard-value {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  line-height: 1;
}
.scoreboard-label {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.78);
}

/* ── Section headings with auto-numbered badges ──────────────────── */
article.report { counter-reset: section; }
h2 {
  counter-increment: section;
  font-family: Georgia, serif;
  font-size: 23px;
  margin: 52px 0 14px;
  padding-top: 0;
  display: flex;
  align-items: baseline;
  gap: 14px;
  border-top: none;
}
h2::before {
  content: counter(section, decimal-leading-zero);
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: var(--accent);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  border-radius: 50%;
  position: relative;
  top: -1px;
}
.section-rule {
  display: block;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  margin-bottom: 28px;
  border-radius: 1px;
}

/* References heading — no badge ─────────────────────────────────── */
h2.refs-heading {
  counter-increment: none;
  font-size: 18px;
  border-top: none;
  margin-top: 0;
  color: var(--muted);
}
h2.refs-heading::before { display: none; }

h3 { font-size: 20px; margin: 34px 0 10px; color: var(--ink); }
h4 { font-size: 17px; margin: 24px 0 8px; }
p { margin: 0 0 14px; }

/* ── Location figures (image2, image3) ───────────────────────────── */
.report-location-figure {
  float: right;
  width: 240px;
  margin: 0 0 16px 24px;
  clear: right;
}
.report-location-figure img {
  width: 100%;
  border-radius: 10px;
  border: 3px solid var(--accent);
  display: block;
}
.report-location-figure figcaption {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  color: var(--muted);
  padding: 5px 4px 0;
  line-height: 1.4;
}
.clearfix::after { content: ""; display: table; clear: both; }

/* ── Pull quote ──────────────────────────────────────────────────── */
.report-pullquote {
  margin: 28px 0;
  padding: 16px 20px 16px 24px;
  border-left: 5px solid var(--accent);
  background: var(--accent-bg);
  border-radius: 0 8px 8px 0;
  font-size: 19px;
  font-style: italic;
  color: var(--ink);
  line-height: 1.5;
  position: relative;
}
.report-pullquote::before {
  content: "\201C";
  font-size: 56px;
  color: var(--accent);
  opacity: 0.35;
  position: absolute;
  top: -4px;
  left: 14px;
  line-height: 1;
  font-family: Georgia, serif;
}
.report-pullquote p { margin: 0; padding-left: 28px; }

/* ── Highlight box ───────────────────────────────────────────────── */
.report-highlight-box {
  background: var(--accent-bg);
  border: 1px solid var(--accent-mid);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 20px 0 24px;
}
.report-highlight-box p:last-child { margin-bottom: 0; }

/* ── Tables ──────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; margin: 14px 0 22px; font-size: 14px; }
th, td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
th {
  background: var(--accent-bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 2px solid var(--accent-mid);
}
tr:hover td { background: color-mix(in srgb, var(--bg) 90%, var(--accent) 10%); }
td a { word-break: break-word; }

/* ── Footnote refs ───────────────────────────────────────────────── */
sup.fn-ref a, sup.footnote-ref a {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.78em;
  padding: 0 1px;
}

/* ── Footnotes section ───────────────────────────────────────────── */
.footnotes {
  margin-top: 60px;
  padding-top: 20px;
  border-top: 2px solid var(--ink);
  font-size: 13px;
  color: var(--muted);
  counter-increment: none;
}
.footnotes ol { padding-left: 1.6em; margin: 12px 0 0; }
.footnotes li { margin-bottom: 6px; line-height: 1.5; }
.fn-back { margin-left: 4px; text-decoration: none; }

/* ── Lists ───────────────────────────────────────────────────────── */
ul, ol { margin: 0 0 14px; padding-left: 1.5em; }
li { margin-bottom: 5px; }
ul li::marker { color: var(--accent); }
strong { font-weight: 700; }
em { font-style: italic; }
code {
  background: var(--accent-bg);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 0.9em;
  font-family: "SF Mono", Menlo, monospace;
}

/* ── Print / Save as PDF ─────────────────────────────────────────── */
@media print {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  body { background: white; font-size: 12pt; }
  .report { max-width: none; padding: 0; }
  .report-hero { height: 180px; }
  .report-location-figure { width: 180px; }
  .report-nav, .site-bar { display: none !important; }
  h2 { page-break-before: always; margin-top: 0; }
  h2:first-of-type { page-break-before: avoid; }
  h3 { page-break-after: avoid; }
  .footnotes { page-break-before: always; }
  .report-scoreboard { page-break-after: avoid; }
  a { color: var(--ink); text-decoration: none; }
  .hero-eyebrow a { color: rgba(255,255,255,0.88); }
}
</style>
</head>
<body>
