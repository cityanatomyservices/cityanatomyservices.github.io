<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports • City Anatomy</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link href="/style.css?v=20260910" rel="stylesheet" />
  <style>
    .apps-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .apps-hero {
      margin-bottom: 3.5rem;
    }
    .apps-hero .content-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    .apps-hero h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.15;
    }
    .apps-hero .hero-lede {
      margin: 0;
      font-size: 1rem;
      color: var(--muted);
      max-width: 560px;
      line-height: 1.6;
    }

    .apps-section {
      margin-bottom: 3.5rem;
    }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .section-header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .section-count {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1rem;
    }

    .app-card {
      display: flex;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--card-accent, var(--accent));
    }

    .card-stripe {
      width: 5px;
      flex-shrink: 0;
      background: var(--card-accent, var(--accent));
    }

    .card-body {
      padding: 1rem 1.1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 0;
    }

    .card-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--card-accent, var(--accent));
      margin: 0;
    }

    .card-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .card-desc {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .card-cta {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--card-accent, var(--accent));
    }

    .page-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      margin-top: 2rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .apps-page { padding: 2rem 1rem 4rem; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="top" class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/index.html">City Anatomy</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="/apps/">Apps</a>
        <a href="/services/">Services</a>
        <a href="/content/">Content</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" type="button" aria-label="Toggle color scheme">
        <span class="toggle-icon">☀️</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>
  </header>

  <main class="apps-page" id="main-content">

    <div class="apps-hero">
      <p class="content-kicker">Product Reports</p>
      <h1>Austin Research Reports</h1>
      <p class="hero-lede">Location intelligence reports on Austin businesses, recreation, and neighborhoods — each with an interactive map, narrative story map, and written report.</p>
    </div>

    <div id="reports-sections"></div>

    <footer class="page-footer">
      <p>&copy; 2025 City Anatomy &bull; Powered by <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a></p>
    </footer>

  </main>

  <script src="/page.js?v=20260910"></script>
  <script>
    (function () {
      const CATEGORY_ORDER = ['Shopping', 'Recreation', 'City Government'];
      const container = document.getElementById('reports-sections');

      fetch('reports.json')
        .then(r => r.ok ? r.json() : [])
        .then(items => {
          if (!items.length) return;

          const byCategory = new Map();
          items.forEach(item => {
            const cat = item.category || 'Other';
            if (!byCategory.has(cat)) byCategory.set(cat, []);
            byCategory.get(cat).push(item);
          });

          const categories = [
            ...CATEGORY_ORDER.filter(c => byCategory.has(c)),
            ...Array.from(byCategory.keys()).filter(c => !CATEGORY_ORDER.includes(c)),
          ];

          categories.forEach(cat => {
            const list = byCategory.get(cat);
            const section = document.createElement('section');
            section.className = 'apps-section';
            section.innerHTML = `
              <div class="section-header">
                <h2>${cat}</h2>
                <span class="section-count">${list.length} report${list.length !== 1 ? 's' : ''}</span>
              </div>
              <div class="cards-grid"></div>
            `;
            const grid = section.querySelector('.cards-grid');

            list.forEach(item => {
              const card = document.createElement('a');
              card.className = 'app-card';
              card.href = item.id + '/storymap/';
              if (item.accent) card.style.setProperty('--card-accent', item.accent);
              card.innerHTML = `
                <div class="card-stripe"></div>
                <div class="card-body">
                  <p class="card-tag">${item.eyebrow || cat}</p>
                  <p class="card-title">${item.title}</p>
                  <p class="card-desc">${item.blurb || ''}</p>
                  <span class="card-cta">View story →</span>
                </div>
              `;
              grid.appendChild(card);
            });

            container.appendChild(section);
          });
        })
        .catch(() => {});
    }());
  </script>
</body>
</html>
