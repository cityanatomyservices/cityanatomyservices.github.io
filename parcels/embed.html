<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico?v=20261031f" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261031f" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261031f" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261031f" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parcelizer — embed</title>
  <link href="/style.css?v=20261023e" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="./style.css" rel="stylesheet" />
  <style>
    /* Embed-only: full-bleed map card sized to fill the iframe, with the
       same rounded-card look the standalone /parcels/ page uses. */
    html, body { height: 100%; margin: 0; background: var(--background); }
    body { display: block; }
    .embed-card {
      position: absolute;
      inset: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px var(--shadow);
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; }
  </style>
<script src="/shared/map-ui.js?v=20261031d"></script>
</head>
<body>
  <div class="embed-card">
    <div id="map"></div>
    <div id="zoom-hint" class="zoom-hint" hidden>Zoom in to view parcels</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./drawer.js"></script>
  <script src="./app.js?v=20261030e"></script>
</body>
</html>
