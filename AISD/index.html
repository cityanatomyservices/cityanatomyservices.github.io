<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AISD School Changes</title>
  <link rel="icon" href="data:," />
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- The page runs on the shared topic map engine in /topicmap/ (its
       stylesheet, app.js and player.js); the files in this folder are the
       data (config.js), the words (copy.js) and what is particular to this
       map (map.js). ?v= so a push is actually seen (GitHub Pages caches
       hard): bump it on the file that changed. -->
  <link rel="stylesheet" href="../topicmap/style.css?v=20260914k" />
  <link rel="stylesheet" href="./style.css?v=20260914h" />
</head>
<body>
  <!-- ONE MAP OF THE AUSTIN ISD SCHOOL CLOSURE AND CONSOLIDATION PLAN, built
       on the same bones as /datacenters/ (2026-09-14): controls and cards
       top-left, a timeline player along the bottom that reveals the campuses
       by role and then tells the story in text cards, an intro card, and a
       ?play&phone mode for 9:16 recordings. Data in ./data/ (exported from
       the GIS library): campuses.geojson (every campus the plan touches, with
       role and the research facts), zones.geojson (pre-plan attendance zones
       of the closing and receiving schools), links.geojson (a line from each
       closing school to where its students go), timeline.json (the plan's
       dates, shown in About). Every word on screen comes from copy.js. -->
  <div class="page">
    <div id="map"></div>

    <a class="home" id="home" href="https://anatomy.city" target="_top"></a>
    <h1 class="title" id="title"></h1>
    <!-- top-left map controls -->
    <div class="topleft">
      <div class="map-controls">
        <button class="map-ctrl map-ctrl-text" id="ctrlSatellite" type="button" aria-pressed="false"></button>
        <button class="map-ctrl" id="ctrlZoomIn" type="button">+</button>
        <button class="map-ctrl" id="ctrlZoomOut" type="button">&minus;</button>
        <button class="map-ctrl" id="ctrlExtent" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg>
        </button>
      </div>
      <!-- the Layers box: one checkbox per overlay in config.js, built by the engine -->
      <div class="overlays">
        <button class="card-toggle overlays-title" id="overlaysTitle" type="button" aria-expanded="true" aria-controls="overlayRows"></button>
        <div id="overlayRows"></div>
      </div>

    <!-- legend: one row per role; ticking a row off hides those campuses and their zones -->
    <aside class="legend" id="legend">
      <button class="card-toggle legend-title" id="legendTitle" type="button" aria-expanded="true" aria-controls="legendBody"></button>
      <div id="legendBody">
      <div class="legend-sub" id="legendSub"></div>
      <ul class="legend-rows" id="legendRows"></ul>
      <button class="about-toggle" id="aboutToggle" type="button" aria-expanded="false" aria-controls="about"></button>
      <div class="about" id="about" hidden>
        <p id="aboutWhat"></p>
        <p><strong id="aboutSourcesLabel"></strong> <span id="aboutSources"></span></p>
        <p><strong id="aboutCaveatsLabel"></strong> <span id="aboutCaveats"></span></p>
        <p><strong id="timelineLabel"></strong></p>
        <ul class="timeline" id="timeline"></ul>
      </div>
      </div>
    </aside>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="./copy.js?v=20260914h"></script>
  <script src="./config.js?v=20260914h"></script>
  <script src="./map.js?v=20260914k"></script>
  <script src="../topicmap/phone.js?v=20260914k"></script>
  <script src="../topicmap/player.js?v=20260914k"></script>
  <script src="../topicmap/app.js?v=20260914k"></script>
</body>
</html>
