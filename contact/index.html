<!DOCTYPE html>

<body>
  <!-- Contact page: only the centre lives here; shell.js draws the frame. -->

    <div class="contact-page">
      <p class="page-kicker">Get in touch</p>
      <h1>Contact</h1>

      <div class="contact-card">

          src="/images/charles-thomas.jpg"

        <div class="contact-details">
          <p class="contact-name">Charles Thomas</p>
          <p class="contact-role">Founder · City Anatomy</p>
          <div class="contact-divider"></div>

          <a href="tel:+15126459434" class="contact-item">
            <span class="contact-item-icon">📞</span>
            <span>512-645-9434</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="/shell.js?v=20261022u"></script>
