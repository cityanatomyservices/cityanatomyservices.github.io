<!DOCTYPE html>
<!-- card.html — one video card, 1080x1920, in the site's own look (day palette,
     Poppins headings, Helvetica body). render-cards.js opens this page, calls
     window.showBeat(beat, index, count, story) for each beat in beats.json and
     screenshots it. No map: the cards are the numbers and the names only
     (owner 2026-10-24). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f7f8fa; --paper: #ffffff; --ink: #1f2933; --dim: #52606d; --line: #d9dee3; --accent: #0067c5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: var(--bg); color: var(--ink); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 96px 80px 80px; }
    h1, h2, .big, .end-line { font-family: 'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; margin: 0; }
    .eyebrow { font-size: 30px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    h1 { font-size: 64px; line-height: 1.15; margin-top: 12px; }
    .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .big { font-size: 360px; line-height: 1; color: var(--accent); letter-spacing: -.02em; }
    .label { font-size: 56px; font-weight: 600; margin-top: 18px; line-height: 1.25; }
    h2 { font-size: 54px; line-height: 1.2; margin-bottom: 44px; }
    .row { display: grid; grid-template-columns: 1fr auto; column-gap: 32px; align-items: baseline; margin-bottom: 38px; }
    .row .name { font-size: 44px; font-weight: 600; line-height: 1.2; }
    .row .n { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: 'Poppins', sans-serif; }
    .row .bar { grid-column: 1 / -1; height: 12px; border-radius: 6px; background: var(--line); margin-top: 14px; overflow: hidden; }
    .row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
    .row .detail { font-size: 34px; color: var(--dim); }
    .top .row { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 2px solid var(--line); }
    .note { margin-top: 30px; font-size: 32px; color: var(--dim); line-height: 1.4; }
    .end-line { font-size: 66px; line-height: 1.3; text-align: center; }
    .end-line.is-accent { color: var(--accent); word-break: break-all; }
    .foot { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: var(--dim); }
    .dots { display: flex; gap: 12px; }
    .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
    .dots i.on { background: var(--accent); }
  </style>
</head>
<body>
  <header><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></header>
  <main class="body" id="body"></main>
  <footer class="foot"><span id="credit"></span><span class="dots" id="dots"></span></footer>
  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    window.showBeat = function (b, index, count, story) {
      document.getElementById('eyebrow').textContent = story.site;
      document.getElementById('title').textContent = b.type === 'end' ? '' : story.title;
      document.getElementById('credit').textContent = story.credit || '';
      document.getElementById('dots').innerHTML = Array.from({ length: count }, (_, i) => `<i class="${i <= index ? 'on' : ''}"></i>`).join('');
      const body = document.getElementById('body');
      body.className = 'body ' + b.type;
      if (b.type === 'all') body.innerHTML = `<div class="big">${esc(b.count)}</div><div class="label">${esc(b.label)}</div>`;
      if (b.type === 'breakdown') {
        const max = Math.max(...b.rows.map((r) => r.count));
        body.innerHTML = `<h2>${esc(b.title)}</h2>` + b.rows.map((r) =>
          `<div class="row"><span class="name">${esc(r.value)}</span><span class="n">${r.count}</span><span class="bar"><i style="width:${Math.round(100 * r.count / max)}%"></i></span></div>`).join('') +
          (b.note ? `<div class="note">${esc(b.note)}</div>` : '');
      }
      if (b.type === 'top') body.innerHTML = `<h2>${esc(b.title)}</h2>` + b.rows.map((r) =>
        `<div class="row"><span class="name">${esc(r.name)}</span><span class="detail">${esc(r.detail)}</span></div>`).join('') +
        (b.note ? `<div class="note">${esc(b.note)}</div>` : '');
      if (b.type === 'end') body.innerHTML = b.lines.map((l, i) => `<div class="end-line${i === b.lines.length - 1 ? ' is-accent' : ''}">${esc(l)}</div>`).join('');
      return document.fonts.ready;
    };
  </script>
</body>
</html>
