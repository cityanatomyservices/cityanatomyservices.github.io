<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin FY 2026-27 Budget Map</title>
  <link rel="icon" href="data:," />
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- ?v= so a push is actually seen (GitHub Pages caches hard). Bump when
       app.js, style.css, config.js or copy.js change. -->
  <link rel="stylesheet" href="./style.css?v=20260912a" />
</head>
<body>
  <!-- A MAP, A ROW OF THEME BUTTONS, A LEGEND. Seven maps of the FY 2026-27
       budget share one page; picking a theme shows that map's layers and its
       legend. Parcels only draw from zoom 11 (the tiles stop below that), so a
       hint shows when zoomed out on a parcel theme. Every word on screen comes
       from copy.js. -->
  <div class="page">
    <div id="map"></div>

    <a class="home" id="home" href="https://anatomy.city" target="_top"></a>
    <h1 class="title" id="title"></h1>

    <nav class="themes" id="themes" aria-label="Maps"></nav>

    <aside class="legend" id="legend">
      <div class="legend-title" id="legendTitle"></div>
      <div class="legend-sub" id="legendSub"></div>
      <ul class="legend-rows" id="legendRows"></ul>
      <!-- "About this map": what the layer shows, how the values are
           calculated, sources and caveats. Text comes from explain.js, which
           is generated from the budget repo's layer_explanations.json. -->
      <button class="about-toggle" id="aboutToggle" type="button" aria-expanded="false" aria-controls="about"></button>
      <div class="about" id="about" hidden>
        <p class="about-what" id="aboutWhat"></p>
        <p><strong id="aboutHowLabel"></strong> <span id="aboutHow"></span></p>
        <p><strong id="aboutSourcesLabel"></strong> <span id="aboutSources"></span></p>
        <p><strong id="aboutCaveatsLabel"></strong> <span id="aboutCaveats"></span></p>
        <p class="about-general" id="aboutGeneral"></p>
      </div>
      <!-- the month slider, only shown on the permits theme -->
      <div class="months" id="months" hidden>
        <button class="play" id="play" type="button"></button>
        <input type="range" id="month" min="0" max="0" value="0" />
        <span class="month-label" id="monthLabel"></span>
      </div>
    </aside>

    <div class="zoom-hint" id="zoomHint" hidden></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <script src="./copy.js?v=20260912a"></script>
  <script src="./explain.js?v=20260912a"></script>
  <script src="./config.js?v=20260912a"></script>
  <script src="./app.js?v=20260912a"></script>
</body>
</html>
