<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moontower</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<!-- Generated by tools/sync-webapps.js from the app. Never hand-edit. -->
<script src="vendor/style-night.js"></script>
<script src="vendor/style-day.js"></script>
<script src="vendor/stops.js"></script>
<script src="vendor/routes.js"></script>
<style>
  /* The app's arclight palette (src/modules/moontowertour/palette.ts):
     ink, raised ink, hairline border, moonlight text, dim moonlight, arc. */
  :root {
    --ink: #070a12;
    --raised: #111827;
    --border: #2b3a55;
    --text: #d8e0f0;
    --dim: #7b849c;
    --accent: #cdd9ff;
    --ember: #9c7b40;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --control: 44px;   /* side of the round map buttons */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
               font-family: var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #map { position: absolute; inset: 0; }
  /* Chrome fades up once the map has drawn, so nothing floats over a black box. */
  .chrome { opacity: 0; transition: opacity .6s ease; }
  body.ready .chrome { opacity: 1; }

  /* ---- shared surfaces -------------------------------------------------- */
  .raised { background: var(--raised); border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .round { width: var(--control); height: var(--control); border-radius: 999px;
           display: grid; place-items: center; font-size: 20px; font-weight: 700;
           text-decoration: none; padding: 0; }
  a.round { color: var(--text); }
  .round.active { color: var(--accent); }
  .round.busy { color: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
  .round:active, .pill:active, .picker-row:active { opacity: .7; }
  .hint { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }

  /* ---- top-left: progress chip + tower picker --------------------------- */
  #chip { position: absolute; left: 12px; top: calc(var(--safe-top) + 12px); z-index: 3;
          display: flex; align-items: baseline; gap: 8px; border-radius: 999px;
          padding: 10px 16px; font-size: 14px; user-select: none; -webkit-user-select: none;
          touch-action: manipulation; }
  #chip-count { color: var(--accent); font-weight: 700; }
  #chip-chevron { font-size: 16px; font-weight: 700; }
  #picker { position: absolute; left: 12px; right: 72px; top: calc(var(--safe-top) + 64px);
            z-index: 3; max-width: 420px; max-height: 55vh; overflow: auto;
            border-radius: 14px; padding: 6px 0; }
  .picker-leg { padding: 8px 14px 4px; color: var(--dim); font-size: 10px; font-weight: 700;
                letter-spacing: .12em; text-transform: uppercase; }
  .picker-row { display: flex; align-items: center; gap: 10px; width: 100%;
                padding: 9px 14px; border: 0; background: none; text-align: left; }
  .picker-glyph { width: 18px; text-align: center; color: var(--dim); font-size: 14px; }
  .picker-glyph.visited { color: var(--accent); }
  .picker-text { display: flex; flex-direction: column; min-width: 0; }
  .picker-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .picker-corner { font-size: 11px; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- top-right: the control stack ------------------------------------- */
  #stack { position: absolute; right: 12px; top: calc(var(--safe-top) + 12px); z-index: 3;
           display: flex; flex-direction: column; gap: 12px; }

  /* ---- bottom-left: distance pill + credits ----------------------------- */
  #distance { position: absolute; left: 10px; bottom: calc(var(--safe-bottom) + 64px); z-index: 3;
              display: flex; align-items: baseline; gap: 8px; border-radius: 999px;
              padding: 10px 16px; font-size: 14px; color: var(--dim); user-select: none;
              -webkit-user-select: none; touch-action: manipulation; }
  #distance .pill-value { font-weight: 700; }
  #distance.active .pill-glyph, #distance.active .pill-value { color: var(--accent); }
  #btn-info { position: absolute; left: 10px; bottom: calc(var(--safe-bottom) + 12px); z-index: 3; }

  /* ---- banner ------------------------------------------------------------ */
  #banner { position: absolute; left: 12px; right: 68px; top: calc(var(--safe-top) + 64px); z-index: 4;
            display: flex; align-items: flex-start; gap: 10px; border-radius: 8px;
            padding: 10px 12px; font-size: 13px; line-height: 18px; max-width: 520px; }
  .banner-text { flex: 1; }
  .banner-close { border: 0; background: none; color: var(--dim); font-size: 15px; padding: 0 4px; }

  /* ---- the tower card ---------------------------------------------------- */
  #card { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 12px); z-index: 5;
          max-width: 520px; max-height: 60vh; overflow: auto; border-radius: 10px; padding: 16px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .kicker { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .close { border: 0; background: none; color: var(--dim); font-size: 18px; line-height: 22px; padding: 0 4px; }
  .card-body { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .name { font-family: var(--serif); font-size: 20px; }
  .corner { font-size: 14px; }
  .meta { font-size: 13px; color: var(--dim); }
  .honest { font-family: var(--serif); font-style: italic; font-size: 14px; line-height: 20px; color: var(--dim); }
  .read-story { border: 0; background: none; padding: 4px 0; color: var(--accent); font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  .lit-tag { border: 1px solid var(--accent); border-radius: 999px; padding: 4px 12px; margin-top: 8px;
             color: var(--accent); font-size: 12px; letter-spacing: .03em; }
  .lit-tag.centered { align-self: center; padding: 6px 16px; }
  .light { align-self: stretch; margin-top: 8px; padding: 12px 16px; border: 1.5px solid var(--accent); border-radius: 8px;
           background: none; color: var(--accent); font-size: 15px; font-weight: 700; letter-spacing: .02em; text-align: center; }
  .light.striking { opacity: .7; animation: pulse .3s infinite alternate; }

  /* ---- the tower's story page ------------------------------------------- */
  #story { position: absolute; inset: 0; z-index: 8; background: var(--ink); overflow: auto;
           -webkit-overflow-scrolling: touch; }
  .story-head { display: flex; align-items: center; gap: 16px; padding: calc(var(--safe-top) + 12px) 20px 12px;
                max-width: 720px; margin: 0 auto; }
  .back { flex: none; border: 1px solid var(--border); background: var(--raised); color: var(--text);
          width: 48px; height: 48px; border-radius: 24px; font-size: 26px; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .story-kicker { flex: 1; text-align: right; color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .story-content { display: flex; flex-direction: column; gap: 22px; padding: 8px 20px calc(var(--safe-bottom) + 48px);
                   max-width: 720px; margin: 0 auto; }
  .story-name { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 34px; }
  .story-sub { font-family: var(--serif); font-size: 16px; line-height: 22px; margin-top: 4px; }
  .story-meta { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .story-status { color: var(--dim); font-size: 13px; line-height: 18px; margin-top: 2px; }
  .honest-box { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
                font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 22px; color: var(--dim); }
  .hook { margin: 0; font-family: var(--serif); font-size: 20px; line-height: 28px; }
  .audio { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .audio-glyph { color: var(--dim); font-size: 18px; }
  .placeholder { font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 22px; color: var(--dim); margin: 0; }
  .section-heading { margin: 0 0 8px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .section-body { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 24px; white-space: pre-line; }
  .source-line { margin: 0; color: var(--dim); font-size: 12px; line-height: 18px; white-space: pre-line; }
  .story-footer { border-top: 1px solid var(--border); padding-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .story-footer .light { margin-top: 0; }
  .back-to-map { border: 0; background: none; padding: 8px; color: var(--accent); font-size: 15px; font-weight: 600; }
  .not-found { align-items: center; }

  /* ---- credits drawer ---------------------------------------------------- */
  #drawer-backdrop { position: absolute; inset: 0; z-index: 9; background: rgba(0,0,0,.35); border: 0; padding: 0; }
  #drawer { position: absolute; top: 0; bottom: 0; right: 0; z-index: 10; width: min(300px, 88vw);
            background: var(--raised); border-left: 1px solid var(--border);
            padding: calc(var(--safe-top) + 64px) 20px 20px; transform: translateX(100%);
            transition: transform .22s ease-out; box-shadow: -2px 0 12px rgba(0,0,0,.5); overflow: auto; }
  #drawer.open { transform: none; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  #drawer-title { font-size: 16px; font-weight: 700; }
  .drawer-close { border: 0; background: none; color: var(--dim); font-size: 16px; font-weight: 700; }
  .drawer-row { display: block; padding: 10px 0; text-decoration: none; }
  .drawer-row:active { opacity: .6; }
  .drawer-label { display: block; color: var(--accent); font-size: 14px; font-weight: 600; }
  .drawer-detail { display: block; color: var(--dim); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }

  #fallback { position: absolute; inset: 0; display: grid; place-items: center; z-index: 20;
              color: var(--dim); font-size: 14px; padding: 16px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="map"></div>

  <!-- Progress chip: "3 of 17 towers lit". Tap for the tower list, hold to reset. -->
  <button id="chip" class="chrome raised" type="button" aria-expanded="false">
    <span><span id="chip-count">0</span> of <span id="chip-total">0</span> <span id="chip-label"></span></span>
    <span id="chip-hint" class="hint"></span>
    <span id="chip-chevron" aria-hidden="true">▾</span>
  </button>
  <div id="picker" class="chrome raised" hidden></div>

  <!-- The round buttons, top to bottom, same order as the app. -->
  <div id="stack" class="chrome">
    <a id="btn-home" class="round raised" href="https://anatomy.city/">⌂</a>
    <button id="btn-locate" class="round raised" type="button">◎</button>
    <button id="btn-mode" class="round raised" type="button" hidden>☀</button>
    <button id="btn-travel" class="round raised" type="button">🚶</button>
    <button id="btn-tilt" class="round raised" type="button">2D</button>
    <button id="btn-extents" class="round raised" type="button">⛶</button>
    <button id="btn-zoom-in" class="round raised" type="button">+</button>
    <button id="btn-zoom-out" class="round raised" type="button">−</button>
  </div>

  <!-- Walked distance: tap to start/pause, hold to reset. -->
  <button id="distance" class="chrome raised pill" type="button">
    <span class="pill-glyph">⇢</span>
    <span class="pill-value" hidden></span>
    <span class="pill-hint hint"></span>
  </button>
  <button id="btn-info" class="chrome round raised" type="button">ⓘ</button>

  <div id="banner" class="raised" hidden>
    <span class="banner-text"></span>
    <button class="banner-close" type="button">✕</button>
  </div>

  <div id="card" class="raised" hidden></div>
  <div id="story" hidden></div>

  <button id="drawer-backdrop" type="button" hidden></button>
  <aside id="drawer">
    <div class="drawer-head">
      <span id="drawer-title"></span>
      <button class="drawer-close" type="button">✕</button>
    </div>
    <div class="drawer-rows"></div>
  </aside>

  <div id="fallback" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
